name: TradeFlow persistence foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-run-a:
    name: postgres-run-a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit full dependency graph
        run: npm audit
      - name: Audit runtime dependency graph
        run: npm audit --omit=dev
      - name: Validate SQL and runtime contract
        run: npm run workflow:validate
      - name: Real PostgreSQL foundation, contracts, concurrency and recovery
        run: npm run test:postgres

  postgres-run-b:
    name: postgres-run-b
    needs: postgres-run-a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit full dependency graph
        run: npm audit
      - name: Audit runtime dependency graph
        run: npm audit --omit=dev
      - name: Validate SQL and runtime contract
        run: npm run workflow:validate
      - name: Second complete verification using a fresh owned PostgreSQL instance
        run: npm run test:postgres

  postgres:
    name: postgres
    needs: [postgres-run-a, postgres-run-b]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require both complete PostgreSQL executions
        if: ${{ always() }}
        shell: bash
        env:
          FIRST_RESULT: ${{ needs['postgres-run-a'].result }}
          SECOND_RESULT: ${{ needs['postgres-run-b'].result }}
        run: |
          set -euo pipefail
          printf 'first=%s second=%s\n' "$FIRST_RESULT" "$SECOND_RESULT"
          test "$FIRST_RESULT" = 'success'
          test "$SECOND_RESULT" = 'success'
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        shell: bash
        run: exit 1

  workstation-baseline:
    name: workstation-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build workstation browser assets
        run: npm run build:ui
      - name: Prefer canonical Ubuntu archive before Azure mirror
        run: |
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'http://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 |
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install workflow browsers and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Real PostgreSQL RFQ workstation in three browsers
        run: npm run test:workflow-browser
      - name: Owned institutional interview rehearsal
        run: npm run interview:verify

  workstation-repeat:
    name: workstation-repeat
    needs: workstation-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build workstation browser assets
        run: npm run build:ui
      - name: Prefer canonical Ubuntu archive before Azure mirror
        run: |
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'http://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 |
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install workflow browsers and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Repeat RFQ workstation without retries
        run: npm run test:workflow-browser -- --repeat-each=2

  workstation:
    name: workstation
    needs: [workstation-baseline, workstation-repeat]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Require baseline and repeated three-browser execution
        if: ${{ always() }}
        shell: bash
        env:
          FIRST_RESULT: ${{ needs['workstation-baseline'].result }}
          SECOND_RESULT: ${{ needs['workstation-repeat'].result }}
        run: |
          set -euo pipefail
          printf 'first=%s second=%s\n' "$FIRST_RESULT" "$SECOND_RESULT"
          test "$FIRST_RESULT" = 'success'
          test "$SECOND_RESULT" = 'success'
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        shell: bash
        run: exit 1

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Independent Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Prefer canonical Ubuntu archive before Azure mirror
        run: |
          test -f /etc/apt/apt-mirrors.txt
          grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'http://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 |
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install legacy browsers and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Execute the complete existing validation command
        run: npm run validate
      - name: Repeat all legacy API and browser regressions
        run: npm test -- --repeat-each=2 --retries=0
