name: TradeFlow local live FIX application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fix-live-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-live-application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node 24 and locked dependency cache
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Independent Python oracle
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Mandatory native, SQL, independent verification and real process-kill matrix
        run: npm run test:fix-live-application
      - name: Retain bounded gate evidence including first failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fix-live-application-${{ github.run_attempt }}
          path: artifacts/fix-live-application-*/
          retention-days: 7
          if-no-files-found: error
