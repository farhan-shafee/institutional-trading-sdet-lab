unsupported:
  - all other message types, tags, enum values and order/replacement types
  - repeating groups, encoded/binary data, non-ASCII, pipe-framed input
  - unknown-order cancel reports and ambiguous NONE identity
  - TradeCorrect, TradeCancel, status-based inferred fills
  - session state, replay/reconnect, logon/logout/heartbeats, sockets
  - financial command execution, database access, cash/settlement/PnL inference
