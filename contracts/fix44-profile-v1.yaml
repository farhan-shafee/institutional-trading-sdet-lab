profile: TradeFlow-FIX44-v1
version: 1
standard: FIX.4.4
status: codec-only; no transport, session or domain-command integration
financial_source: 6016fb700840d081fe1fba651c918f0a7e709383
instrument_revisions:
  SYN-UST-2031: { revision: phase1-ust-1, security_type: TNOTE, day_count: ACT_ACT_ICMA }
  SYN-CORP-2031: { revision: phase1-corp-1, security_type: CORP, day_count: THIRTY_360_US }
valuation_model: phase1-regular-coupon-v1
identities:
  client_comp_id: TRADEFLOW
  dealer_comp_ids: [ATLAS, BIRCH, CEDAR]
  cl_ord_id: canonical lower-case UUID; cancellation UUID differs from original order UUID
  dealer_identifiers: matching dealer prefix plus hyphen and 1..48 upper-case ASCII letters, digits or hyphens
limits:
  frame_bytes: 8192
  fields: 64
  retained_buffer_bytes: 16384
  emitted_batch: 16
  value_bytes: 256
wire:
  delimiter: SOH byte 0x01; pipes are display only
  header_order: ['8', '9', '35', '49', '56', '34', '43', '52', '122']
  trailer: '10'
  body_length: byte count from start of 35 through SOH immediately before 10
  checksum: sum of all bytes preceding 10 modulo256, exactly three digits
  body_order: decoder accepts any flat body order; encoder uses per-message canonical_order
  ascii: printable ASCII values only; no binary or encoded fields
  utc_time: YYYYMMDD-HH:MM:SS or YYYYMMDD-HH:MM:SS.sss; years 1900..2199; leap seconds unsupported
  dates: YYYYMMDD; valid Gregorian calendar; settlement 20250115 inclusive to 20310115 exclusive
  quantities: USD face; canonical nonnegative decimal strings with two places; maximum 1000000000.00
  prices: USD per 100 par; canonical positive decimal strings with twelve places, up to 99999.999999999999
  zero_avg_px: '0.000000000000'
messages:
  D:
    name: NewOrderSingle
    direction: CLIENT_TO_DEALER
    standard_required_flat: ['11', '54', '60', '40']
    standard_required_components: [Instrument, OrderQtyData]
