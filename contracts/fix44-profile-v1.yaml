      name: OrderQty,
      standard: OrderQtyData or optional 8 field,
      profile: original total face at least 1.00,
    }
  '40': { name: OrdType, standard: required D; optional 8, values: ['2'], profile: Limit }
  '59': { name: TimeInForce, standard: optional D/8, values: ['1'], profile: GTC }
  '423': { name: PriceType, standard: optional D/8, values: ['1'], profile: Percentage per 100 par }
  '44':
