      ['11', '55', '167', '54', '854', '38', '40', '59', '423', '44', '15', '64', '60', '75']
    forbidden_examples: ['37', '17', '41', '63']
    conditions: Limit Price(44) required by FIX prose and profile; no dealer OrderID before acknowledgment
  '8':
    name: ExecutionReport
    direction: DEALER_TO_CLIENT
