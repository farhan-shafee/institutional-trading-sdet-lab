      trade_partial: 150=F,39=1; 0<CumQty<OrderQty; CumQty+LeavesQty=OrderQty
      trade_full: 150=F,39=2; CumQty=OrderQty,LeavesQty=0
      trade_while_pending_cancel: 150=F,39=6; 0<CumQty<=OrderQty; CumQty+LeavesQty=OrderQty
      canceled: 150=4,39=4; cancel ClOrdID and original 41; CumQty<OrderQty,LeavesQty=0
      avg_px: zero when no executions, otherwise exact contractual clean price; this profile has a single execution price
      order_reject_reason: 103=6 duplicate order or 99 synthetic other; duplicate order does not prove original rejection
