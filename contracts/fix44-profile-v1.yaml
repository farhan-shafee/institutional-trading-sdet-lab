      standard: required on 8; not in 9,
      profile: dealer report identifier,
      not automatically an execution,
    }
  '55': { name: Symbol, standard: Instrument component, profile: exact fictional instrument ID }
  '167': { name: SecurityType, standard: optional Instrument field, values: [TNOTE, CORP] }
  '54':
    {
