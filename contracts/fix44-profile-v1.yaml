fields:
  '8': { name: BeginString, rule: FIX.4.4, standard: required header first }
  '9': { name: BodyLength, rule: canonical positive byte count, standard: required header second }
  '35': { name: MsgType, values: [D, '8', F, '9'], standard: required header third }
  '49':
    { name: SenderCompID, standard: required header, profile: direction-bound fictional identity }
  '56':
    { name: TargetCompID, standard: required header, profile: direction-bound fictional identity }
  '34':
    {
      name: MsgSeqNum,
      standard: required header,
      profile: '1..2147483647; no sequence state maintained',
    }
  '43': { name: PossDupFlag, values: [Y, N], standard: optional header, profile: Y requires 122 }
  '52':
    {
      name: SendingTime,
      standard: required header,
      profile: syntactically valid UTC,
      no clock-freshness claim,
    }
  '122':
    { name: OrigSendingTime, standard: conditional header, profile: iff 43=Y; no later than 52 }
  '11':
    {
      name: ClOrdID,
      standard: message-dependent,
      profile: original order UUID except cancel messages/pending-cancel/canceled reports use cancellation UUID,
    }
  '41':
