              type: string
              pattern: ^(?:[1-9][0-9]{0,8}|1000000000)$
            commit_seq:
              type: string
              pattern: ^(0|[1-9][0-9]{0,2})$
            read_only:
              type: boolean
        scope:
          type: string
          enum:
            - read
            - trade
    WorkflowCommand:
      type: object
      additionalProperties: false
      required:
        - command
      properties:
        command:
          type: object
          additionalProperties: false
          required:
            - idempotency_key
            - operation
            - command_seq
            - http_status
            - result_kind
            - response_body
            - created_at
          properties:
            idempotency_key:
              type: string
              pattern: ^[A-Za-z0-9_-]{8,128}$
            operation:
              type: string
              enum:
                - CREATE_SANDBOX
                - ROTATE_CAPABILITIES
                - CREATE_RFQ
                - RESPOND_DEALER
                - WITHDRAW_QUOTE
                - ACCEPT_QUOTE
                - ACK_ORDER
                - REJECT_ORDER
                - EXECUTE_ORDER
                - REQUEST_CANCEL
                - ACK_CANCEL
                - REJECT_CANCEL
            command_seq:
              type: string
              pattern: ^(0|[1-9][0-9]{0,2})$
            http_status:
              type: integer
              enum:
                - 200
                - 201
                - 409
            result_kind:
              type: string
              enum:
                - APPLIED
                - REJECTED
            response_body:
              oneOf:
                - $ref: '#/components/schemas/SandboxResponse'
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/RfqDetail'
                - $ref: '#/components/schemas/FiOrderCommand'
            created_at:
              type: string
              format: date-time
    WorkflowAudit:
      type: object
      additionalProperties: false
      required:
        - events
        - as_of_seq
        - next_cursor
      properties:
        events:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - command_seq
              - event_index
              - event_type
              - aggregate_version
              - actor_id
              - actor_kind
              - decided_at
              - recorded_at
              - payload
            properties:
              command_seq:
                type: string
                pattern: ^(0|[1-9][0-9]{0,2})$
              event_index:
                type: integer
                enum:
                  - 0
                  - 1
                  - 2
              event_type:
                type: string
                enum:
                  - SANDBOX_CREATED
                  - CAPABILITIES_ROTATED
                  - COMMAND_REJECTED
                  - RFQ_CREATED
                  - DEALER_RESPONDED
                  - DEALER_DECLINED
                  - QUOTE_PUBLISHED
                  - QUOTE_WITHDRAWN
                  - RFQ_EXPIRED
                  - QUOTE_ACCEPTED
                  - RFQ_ACCEPTED
                  - ORDER_CREATED
                  - ORDER_ACKNOWLEDGED
                  - ORDER_REJECTED
                  - EXECUTION_RECORDED
                  - ORDER_STATE_CHANGED
                  - POSITION_UPDATED
                  - EXECUTION_DUPLICATE
                  - CANCEL_REQUESTED
                  - CANCEL_ACKNOWLEDGED
                  - CANCEL_REJECTED
              aggregate_version:
                type: string
                nullable: true
                pattern: ^[1-9][0-9]*$
              actor_id:
                type: string
                format: uuid
              actor_kind:
                type: string
                enum:
                  - CLIENT
              decided_at:
                type: string
                format: date-time
              recorded_at:
                type: string
                format: date-time
              payload:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required:
                      - generation
                    properties:
                      generation:
                        type: string
                        pattern: ^[1-9][0-9]*$
                  - type: object
                    additionalProperties: false
                    required:
                      - code
                    properties:
                      code:
                        type: string
                        minLength: 1
                        maxLength: 64
                  - type: object
                    additionalProperties: false
                    required:
                      - rfq_id
                    properties:
                      rfq_id:
                        type: string
                        format: uuid
                      quote_id:
                        type: string
                        format: uuid
                      order_id:
                        type: string
                        format: uuid
                      dealer_id: &a4
                        type: string
                        enum:
                          - ATLAS
                          - BIRCH
                          - CEDAR
                      code:
                        type: string
                        minLength: 1
                        maxLength: 64
        as_of_seq:
          type: string
          pattern: ^(0|[1-9][0-9]{0,2})$
        next_cursor:
          type: string
          nullable: true
          maxLength: 1024
    RfqCreate:
      type: object
      additionalProperties: false
      required:
        - rfq_id
        - instrument_id
        - side
        - par_amount
        - settlement_date
        - invited_dealers
      properties:
        rfq_id:
          type: string
          format: uuid
        instrument_id: &a6
          type: string
          enum:
            - SYN-UST-2031
            - SYN-CORP-2031
        side: &a7
          type: string
          enum:
            - BUY
            - SELL
