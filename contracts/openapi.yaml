    PostTradePnl:
      type: object
      additionalProperties: false
      required:
        - opening_cash_usd
        - available_cash_usd
        - signed_unsettled_cash_usd
        - economic_security_mark_usd
        - equity_usd
        - realized_pnl_usd
        - realized_pnl_exact_usd
        - unrealized_pnl_usd
        - total_pnl_usd
        - presentation_rounding_delta_usd
        - available_securities
        - lots
      properties:
        opening_cash_usd:
          type: string
          enum:
            - '100000000.00'
        available_cash_usd:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          description: Available funded cash at source sequence; never a historical cash
            balance inferred from valuation date.
        signed_unsettled_cash_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        economic_security_mark_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        equity_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        realized_pnl_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        realized_pnl_exact_usd:
          $ref: '#/components/schemas/PostTradeExactUsd'
        unrealized_pnl_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        total_pnl_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        presentation_rounding_delta_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        available_securities:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - instrument_id
              - available_par
            properties:
              instrument_id:
                type: string
                enum:
                  - SYN-UST-2031
                  - SYN-CORP-2031
              available_par:
                type: string
                pattern: ^[0-9]+\.[0-9]{2}$
          minItems: 2
          maxItems: 2
          description: One account for each original eligible profile; settled
            availability is separate from adjusted economic exposure.
        lots:
          type: array
          items:
            $ref: '#/components/schemas/PostTradeLot'
          minItems: 0
          maxItems: 8
