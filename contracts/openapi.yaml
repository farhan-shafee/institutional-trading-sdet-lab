openapi: 3.0.3
info:
  title: TradeFlow Lab API
  version: 1.0.0
  description: >-
    Synthetic interview and learning lab with a local default and a bounded
    hosted-demo mode. No real orders, credentials, brokerage connectivity,
    market data, or financial transactions. Every login creates an isolated
    in-memory order book; DELETE /api/session releases it. A process restart
    discards all sessions and books. Hosted-demo defaults are an absolute
    30-minute session lifetime, 50 live sessions, and 100 total orders per book,
    including the five seed orders. Requests do not extend session lifetime.
    Hosted-demo admission uses fixed 60-second windows: 600 requests globally,
    60 session-creation attempts before body parsing, and 120 order mutations
    globally plus 30 order mutations per session. All routes consume the global
    request budget except GET /health and DELETE /api/session; those two
    operations are exempt from all admission budgets. Local mode applies none
    of these hosted-demo limits. JSON body limits remain 16384 bytes in both
    modes. Native HTTP transport protections may return 408, 431, or a socket
    admission 503 without the application JSON error envelope; those transport
    responses are distinct from the application responses documented below.
servers:
  - url: http://127.0.0.1:3000
    description: Local loopback server; PORT may override 3000.
  - url: /
    description: Current host when this specification is served by a hosted demo.
tags:
  - name: Environment
  - name: Session
  - name: Orders
  - name: Positions
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Environment]
      operationId: getHealth
      summary: Check readiness and synthetic identity
      description: Exempt from hosted-demo request and mutation admission budgets.
      security: []
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /openapi.yaml:
    get:
      tags: [Environment]
      operationId: getOpenApiDocument
      summary: Read this public API specification
      security: []
      responses:
        '200':
          description: This OpenAPI 3.0 YAML document.
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/fixed-income/v1/instruments:
    get:
      operationId: listFixedIncomeInstruments
      summary: Read synthetic fixed-income instruments
      description: Authenticated stateless read for both roles; consumes ordinary global admission, never mutates or extends a session.
      responses:
        '200':
          description: Valid synthetic instruments; decimal quantities are strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedIncomeInstruments'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/fixed-income/v1/analytics:
    get:
      operationId: getFixedIncomeAnalytics
      summary: Read synthetic fixed-income analytics
      description: >-
        Authenticated stateless read for both roles; consumes ordinary global admission,
        never mutates or extends a session. Supply exactly one of yield or clean_price.
        Unknown/repeated parameters are rejected. Rates are annual decimal fractions
        (0.04 is 4%), compounded semiannually; prices are per 100 par. Yield range
        [-0.10, 1.00]; positive clean price <=10000 must imply a yield in that bracket.
        Par is USD face amount from 1 through 1000000000 with at most 2 decimal places.
        Settlement must be >=2025-01-15 and <2031-01-15; settlement-day coupons are excluded.
      parameters:
        - in: query
          name: instrument_id
          required: true
          schema:
            type: string
            maxLength: 24
            enum: [SYN-UST-2031, SYN-CORP-2031]
        - in: query
          name: settlement_date
          required: true
          schema:
            type: string
            maxLength: 24
            format: date
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        - in: query
          name: par_amount
          required: true
          schema:
            type: string
            maxLength: 24
            pattern: '^[0-9]{1,10}(\.[0-9]{1,2})?$'
        - in: query
          name: yield
          required: false
          schema:
            type: string
            maxLength: 24
            pattern: '^-?[0-9]{1,10}(\.[0-9]{1,12})?$'
        - in: query
          name: clean_price
          required: false
          schema:
            type: string
            maxLength: 24
            pattern: '^-?[0-9]{1,10}(\.[0-9]{1,12})?$'
      responses:
        '200':
          description: Valid synthetic analytics; decimal quantities are strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedIncomeAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/session:
    post:
      tags: [Session]
      operationId: createSession
      summary: Authenticate synthetic credentials and create a fresh isolated book
      description: >-
        qa.user has trader permissions and qa.viewer has viewer permissions.
        Both use the public synthetic password Password123!. In hosted-demo
        mode, session creation is rate limited before body parsing and a full
        live-session capacity rejects creation without allocating a book.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              username: qa.user
              password: Password123!
      responses:
        '200':
          description: Fresh synthetic session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid synthetic credentials (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SessionCapacityReached'
    get:
      tags: [Session]
      operationId: getSession
      summary: Restore the identity of the current synthetic session
      description: Restoring a hosted-demo session does not extend its absolute lifetime.
      responses:
        '200':
          description: Current user; does not create a new book or token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: Revoke the bearer token and release its isolated book
      description: Exempt from all hosted-demo admission budgets so logout remains available.
      responses:
        '204':
          description: Session removed; no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the authenticated session's synthetic orders
      description: >-
        Filters combine with AND. Unknown, empty, repeated, or unsupported filter
        parameters return VALIDATION_ERROR. An omitted filter means all values.
      parameters:
        - name: symbol
          in: query
          schema:
            $ref: '#/components/schemas/Symbol'
        - name: side
          in: query
          schema:
            $ref: '#/components/schemas/Side'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders, including an empty array when no orders match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Submit a synthetic order (trader role)
      description: >-
        A valid submission gets a unique ID, current UTC timestamp, and NEW
        status. This lab simulates no fills or market executions. MARKET forbids
        limitPrice; LIMIT requires a positive finite numeric limitPrice.
        Hosted-demo order capacity counts every order in the session book,
        including seed and terminal orders; cancellation does not release a slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            examples:
              market:
                value:
                  symbol: AAPL
                  side: BUY
                  quantity: 100
                  type: MARKET
              limit:
                value:
                  symbol: MSFT
                  side: SELL
                  quantity: 50
                  type: LIMIT
                  limitPrice: 410.5
      responses:
        '201':
          description: Order created in this session's book.
          headers:
            Location:
              description: Relative URL of the synthetic order detail.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OrderCapacityReached'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Inspect an order in the current session's book
      responses:
        '200':
          description: Synthetic order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an eligible synthetic order (trader role)
      description: >-
        Only NEW and PARTIALLY_FILLED may transition to CANCELED. FILLED,
        CANCELED, and REJECTED return 409 and remain unchanged. No body is needed.
        Hosted-demo order capacity does not prevent cancellation; request and
        mutation admission budgets still apply.
      responses:
        '200':
          description: Order now has CANCELED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: ORDER_NOT_CANCELABLE; the prior state is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/positions:
    get:
      tags: [Positions]
      operationId: listPositions
      summary: Read the static synthetic positions model
      description: Position quantities are deliberately not recalculated by order submission or cancellation.
      responses:
        '200':
          description: Four synthetic reference positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Random, in-memory synthetic session token. No production identity provider.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: >-
        A seeded or session-generated synthetic order ID. The server percent-decodes
        the parameter once; malformed encoding returns 400 (VALIDATION_ERROR).
      schema:
        type: string
        minLength: 1
      example: seed-new-aapl
  responses:
    BadRequest:
      description: >-
        Invalid fields, filters, or path encoding (VALIDATION_ERROR),
        or malformed JSON (INVALID_JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Viewer role cannot mutate orders (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderNotFound:
      description: Order does not exist in this session's book (ORDER_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderCapacityReached:
      description: >-
        Hosted-demo session book reached its total order capacity
        (ORDER_CAPACITY_REACHED). The book is unchanged. Cancellation remains
        available but does not release capacity. No Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: JSON body exceeds 16384 bytes (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: JSON endpoint requires Content-Type application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: >-
        A hosted-demo request, authentication, or order-mutation admission
        budget is exhausted (RATE_LIMITED). The request does not perform its
        requested action. Retry after the indicated fixed-window reset.
      headers:
        Retry-After:
          description: Positive integer seconds until the exhausted admission window resets.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionCapacityReached:
      description: >-
        Hosted-demo live-session capacity is full (SESSION_CAPACITY_REACHED).
        No session or book is created. Capacity becomes available when a live
        session expires or is deleted. No Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FixedIncomeInstrument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          issuer,
          currency,
          coupon_rate,
          dated_date,
          maturity_date,
          frequency,
          day_count,
          fictional,
        ]
      properties:
        id: { type: string, enum: [SYN-UST-2031, SYN-CORP-2031] }
        issuer: { type: string, minLength: 1 }
        currency: { type: string, enum: [USD] }
        coupon_rate: { type: string, enum: ['0.04'] }
        dated_date: { type: string, enum: ['2025-01-15'] }
        maturity_date: { type: string, enum: ['2031-01-15'] }
        frequency: { type: integer, enum: [2] }
        day_count: { type: string, enum: [ACT_ACT_ICMA, THIRTY_360_US] }
        fictional: { type: boolean, enum: [true] }
    FixedIncomeInstruments:
      type: object
      additionalProperties: false
      required: [instruments]
      properties:
        instruments:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/FixedIncomeInstrument' }
    FixedIncomeAnalytics:
      type: object
      additionalProperties: false
      required:
        [
          instrument,
          settlement_date,
          par_amount,
          yield,
          clean_price,
          dirty_price,
          accrued_interest,
          macaulay_duration,
          modified_duration,
          convexity,
          dv01_usd,
          consideration_usd,
          previous_coupon_date,
          next_coupon_date,
          remaining_coupon_dates,
          conventions,
        ]
      properties:
        instrument: { $ref: '#/components/schemas/FixedIncomeInstrument' }
        settlement_date: { type: string, format: date }
        previous_coupon_date: { type: string, format: date }
        next_coupon_date: { type: string, format: date }
        remaining_coupon_dates:
          type: array
          minItems: 1
          items: { type: string, format: date }
        par_amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        yield:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{12}$'
        clean_price:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        dirty_price:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        accrued_interest:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        macaulay_duration:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        modified_duration:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        convexity:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{10}$'
        dv01_usd:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{8}$'
        consideration_usd:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        conventions:
          type: object
          additionalProperties: false
          required:
            [precision_digits, rounding, price_unit, rate_unit, risk_unit, schedule, valuation]
          properties:
            precision_digits:
              type: integer
              enum: [50]
            rounding:
              type: string
              enum: ['ROUND_HALF_EVEN']
            price_unit:
              type: string
              enum: ['per 100 par']
            rate_unit:
              type: string
              enum: ['annual decimal fraction, semiannual compounding']
            risk_unit:
              type: string
              enum: ['duration years; convexity years squared; DV01 USD for stated long par']
            schedule:
              type: string
              enum: ['regular semiannual, unadjusted, settlement-day coupon excluded']
            valuation:
              type: string
              enum: ['fractional-period compound discounting; no holiday adjustment or ex-dividend']
    Symbol:
      type: string
      enum: [AAPL, MSFT, NVDA, SPY]
    Side:
      type: string
      enum: [BUY, SELL]
    OrderStatus:
      type: string
      enum: [NEW, PARTIALLY_FILLED, FILLED, CANCELED, REJECTED]
    CreateOrder:
      type: object
      additionalProperties: false
      required: [symbol, side, quantity, type]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        type:
          type: string
          enum: [MARKET, LIMIT]
        limitPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
      oneOf:
        - properties:
            type:
              type: string
              enum: [MARKET]
          not:
            required: [limitPrice]
        - properties:
            type:
              type: string
              enum: [LIMIT]
          required: [limitPrice]
    Order:
      type: object
      additionalProperties: false
      required: [id, symbol, side, quantity, type, status, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        symbol:
          $ref: '#/components/schemas/Symbol'
        side:
          $ref: '#/components/schemas/Side'
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        type:
          type: string
          enum: [MARKET, LIMIT]
        limitPrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
      oneOf:
        - properties:
            type:
              type: string
              enum: [MARKET]
          not:
            required: [limitPrice]
        - properties:
            type:
              type: string
              enum: [LIMIT]
          required: [limitPrice]
    OrderResponse:
      type: object
      additionalProperties: false
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
    OrdersResponse:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Position:
      type: object
      additionalProperties: false
      required: [symbol, quantity, averagePrice]
      properties:
        symbol:
          $ref: '#/components/schemas/Symbol'
        quantity:
          type: integer
        averagePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
    PositionsResponse:
      type: object
      additionalProperties: false
      required: [positions]
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
    SessionRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username:
          type: string
          enum: [qa.user, qa.viewer]
        role:
          type: string
          enum: [trader, viewer]
    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
          minLength: 1
        user:
          $ref: '#/components/schemas/User'
    CurrentSessionResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, synthetic]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [TradeFlow Lab]
        synthetic:
          type: boolean
          enum: [true]
