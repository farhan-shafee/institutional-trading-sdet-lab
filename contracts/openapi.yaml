openapi: 3.0.3
info:
  title: TradeFlow Lab API
  version: 1.0.0
  description: 'Synthetic interview and learning lab with a local default and a bounded
    hosted-demo mode. No real orders, credentials, brokerage connectivity, market data, or
    financial transactions. Every login creates an isolated in-memory order book; DELETE
    /api/session releases it. A process restart discards all sessions and books. Hosted-demo
    defaults are an absolute 30-minute session lifetime, 50 live sessions, and 100 total orders
    per book, including the five seed orders. Requests do not extend session lifetime.
    Hosted-demo admission uses fixed 60-second windows: 600 requests globally, 60
    session-creation attempts before body parsing, and 120 order mutations globally plus 30
    order mutations per session. All routes consume the global request budget except GET /health
    and DELETE /api/session; those two operations are exempt from all admission budgets. Local
    mode applies none of these hosted-demo limits. JSON body limits remain 16384 bytes in both
    modes. Native HTTP transport protections may return 408, 431, or a socket admission 503
    without the application JSON error envelope; those transport responses are distinct from the
    application responses documented below.'
servers:
  - url: http://127.0.0.1:3000
    description: Local loopback server; PORT may override 3000.
  - url: /
    description: Current host when this specification is served by a hosted demo.
tags:
  - name: Environment
  - name: Session
  - name: Orders
  - name: Positions
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - Environment
      operationId: getHealth
      summary: Check readiness and synthetic identity
      description: Exempt from hosted-demo request and mutation admission budgets.
      security: []
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /openapi.yaml:
    get:
      tags:
        - Environment
      operationId: getOpenApiDocument
      summary: Read this public API specification
      security: []
      responses:
        '200':
          description: This OpenAPI 3.0 YAML document.
          content:
            application/yaml:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/fixed-income/v1/instruments:
    get:
      operationId: listFixedIncomeInstruments
      summary: Read synthetic fixed-income instruments
      description: Authenticated stateless read for both roles; consumes ordinary global admission,
        never mutates or extends a session.
      responses:
        '200':
          description: Valid synthetic instruments; decimal quantities are strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedIncomeInstruments'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/fixed-income/v1/analytics:
    get:
      operationId: getFixedIncomeAnalytics
      summary: Read synthetic fixed-income analytics
      description: Authenticated stateless read for both roles; consumes ordinary global admission,
        never mutates or extends a session. Supply exactly one of yield or clean_price.
        Unknown/repeated parameters are rejected. Rates are annual decimal fractions (0.04 is
        4%), compounded semiannually; prices are per 100 par. Yield range [-0.10, 1.00];
        positive clean price <=10000 must imply a yield in that bracket. Par is USD face amount
        from 1 through 1000000000 with at most 2 decimal places. Settlement must be >=2025-01-15
        and <2031-01-15; settlement-day coupons are excluded.
      parameters:
        - in: query
          name: instrument_id
          required: true
          schema:
            type: string
            maxLength: 24
            enum:
              - SYN-UST-2031
              - SYN-CORP-2031
        - in: query
          name: settlement_date
          required: true
          schema:
            type: string
            maxLength: 24
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        - in: query
          name: par_amount
          required: true
          schema:
            type: string
            maxLength: 24
            pattern: ^[0-9]{1,10}(\.[0-9]{1,2})?$
        - in: query
          name: yield
          required: false
          schema:
            type: string
            maxLength: 24
            pattern: ^-?[0-9]{1,10}(\.[0-9]{1,12})?$
        - in: query
          name: clean_price
          required: false
          schema:
            type: string
            maxLength: 24
            pattern: ^-?[0-9]{1,10}(\.[0-9]{1,12})?$
      responses:
        '200':
          description: Valid synthetic analytics; decimal quantities are strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedIncomeAnalytics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/session:
    post:
      tags:
        - Session
      operationId: createSession
      summary: Authenticate synthetic credentials and create a fresh isolated book
      description: qa.user has trader permissions and qa.viewer has viewer permissions. Both use the
        public synthetic password Password123!. In hosted-demo mode, session creation is rate
        limited before body parsing and a full live-session capacity rejects creation without
        allocating a book.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
            example:
              username: qa.user
              password: Password123!
      responses:
        '200':
          description: Fresh synthetic session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid synthetic credentials (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/SessionCapacityReached'
    get:
      tags:
        - Session
      operationId: getSession
      summary: Restore the identity of the current synthetic session
      description: Restoring a hosted-demo session does not extend its absolute lifetime.
      responses:
        '200':
          description: Current user; does not create a new book or token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Session
      operationId: deleteSession
      summary: Revoke the bearer token and release its isolated book
      description: Exempt from all hosted-demo admission budgets so logout remains available.
      responses:
        '204':
          description: Session removed; no response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders:
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List the authenticated session's synthetic orders
      description: Filters combine with AND. Unknown, empty, repeated, or unsupported filter
        parameters return VALIDATION_ERROR. An omitted filter means all values.
      parameters:
        - name: symbol
          in: query
          schema:
            $ref: '#/components/schemas/Symbol'
        - name: side
          in: query
          schema:
            $ref: '#/components/schemas/Side'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders, including an empty array when no orders match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Submit a synthetic order (trader role)
      description: A valid submission gets a unique ID, current UTC timestamp, and NEW status. This
        lab simulates no fills or market executions. MARKET forbids limitPrice; LIMIT requires a
        positive finite numeric limitPrice. Hosted-demo order capacity counts every order in the
        session book, including seed and terminal orders; cancellation does not release a slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            examples:
              market:
                value:
                  symbol: AAPL
                  side: BUY
                  quantity: 100
                  type: MARKET
              limit:
                value:
                  symbol: MSFT
                  side: SELL
                  quantity: 50
                  type: LIMIT
                  limitPrice: 410.5
      responses:
        '201':
          description: Order created in this session's book.
          headers:
            Location:
              description: Relative URL of the synthetic order detail.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/OrderCapacityReached'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Inspect an order in the current session's book
      responses:
        '200':
          description: Synthetic order detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags:
        - Orders
      operationId: cancelOrder
      summary: Cancel an eligible synthetic order (trader role)
      description: Only NEW and PARTIALLY_FILLED may transition to CANCELED. FILLED, CANCELED, and
        REJECTED return 409 and remain unchanged. No body is needed. Hosted-demo order capacity
        does not prevent cancellation; request and mutation admission budgets still apply.
      responses:
        '200':
          description: Order now has CANCELED status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          description: ORDER_NOT_CANCELABLE; the prior state is unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/positions:
    get:
      tags:
        - Positions
      operationId: listPositions
      summary: Read the static synthetic positions model
      description: Position quantities are deliberately not recalculated by order submission or
        cancellation.
      responses:
        '200':
          description: Four synthetic reference positions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/fixed-income/v1/workflow/status:
    get:
      tags:
        - FixedIncomeWorkflow
      operationId: getWorkflowStatus
      summary: getWorkflowStatus
      description:
        Optional local-only feature, default off. Existing login and bearer token required.
        Workflow bindings are separate from ephemeral equity books. Reports availability without
        requiring PostgreSQL when disabled. No query parameters.
      responses:
        '200':
          description: Confirmed response. Monetary trading workflows are outside Phase 2A.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatus'
        '400':
          description: Invalid strict request, date/UUID/key/capability encoding, or query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Existing synthetic session missing or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role, capability scope or current binding does not authorize the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description:
            Disabled workflow, unknown/foreign/purged sandbox or missing command; no ownership
            disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting key, generation, state, expiry or cursor; original receipt is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workflow admission or sandbox quota exhausted; no new effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected safe internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database/schema/capacity unavailable or OUTCOME_UNKNOWN. Retain the original
            journal and idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/fixed-income/v1/sandboxes:
    post:
      tags:
        - FixedIncomeWorkflow
      operationId: createSandbox
      summary: createSandbox
      description: 'Optional local-only feature, default off. Existing login and bearer token
        required. Workflow bindings are separate from ephemeral equity books. Trader only.
        Client must securely retain distinct read/trade capabilities, UUID and idempotency key
        before submission. One transaction creates ownership, capacity, receipt and audit. Same
        authorized key/request replays 201 with Idempotency-Replayed: true and original
        Location. Changed key fingerprint returns 409. Purged UUIDs cannot be recreated. No
        query parameters.'
      responses:
        '201':
          description: Confirmed response. Monetary trading workflows are outside Phase 2A.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          description: Invalid strict request, date/UUID/key/capability encoding, or query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Existing synthetic session missing or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role, capability scope or current binding does not authorize the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description:
            Disabled workflow, unknown/foreign/purged sandbox or missing command; no ownership
            disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting key, generation, state, expiry or cursor; original receipt is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: JSON body exceeds 16384 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Use application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workflow admission or sandbox quota exhausted; no new effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected safe internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database/schema/capacity unavailable or OUTCOME_UNKNOWN. Retain the original
            journal and idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,128}$
          description:
            Scoped to sandbox across operations; same canonical request replays the original
            response. Never regenerate after an uncertain outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxCreate'
  /api/fixed-income/v1/sandboxes/recover:
    post:
      tags:
        - FixedIncomeWorkflow
      operationId: recoverSandbox
      summary: recoverSandbox
      description:
        Optional local-only feature, default off. Existing login and bearer token required.
        Workflow bindings are separate from ephemeral equity books. Explicit recovery binding;
        no equity-book recovery or durable business mutation. Viewer may recover read scope
        only. Fixed binding lifetime 30 minutes, never extended by requests. No query
        parameters.
      responses:
        '200':
          description: Confirmed response. Monetary trading workflows are outside Phase 2A.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          description: Invalid strict request, date/UUID/key/capability encoding, or query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Existing synthetic session missing or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role, capability scope or current binding does not authorize the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description:
            Disabled workflow, unknown/foreign/purged sandbox or missing command; no ownership
            disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting key, generation, state, expiry or cursor; original receipt is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: JSON body exceeds 16384 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Use application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workflow admission or sandbox quota exhausted; no new effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected safe internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database/schema/capacity unavailable or OUTCOME_UNKNOWN. Retain the original
            journal and idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxRecover'
  /api/fixed-income/v1/sandboxes/{sid}:
    get:
      tags:
        - FixedIncomeWorkflow
      operationId: getSandbox
      summary: getSandbox
      description:
        Optional local-only feature, default off. Existing login and bearer token required.
        Workflow bindings are separate from ephemeral equity books. Requires matching binding
        and current capability generation. Read-only recovery continues after day seven until
        day thirty. No query parameters.
      responses:
        '200':
          description: Confirmed response. Monetary trading workflows are outside Phase 2A.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          description: Invalid strict request, date/UUID/key/capability encoding, or query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Existing synthetic session missing or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role, capability scope or current binding does not authorize the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description:
            Disabled workflow, unknown/foreign/purged sandbox or missing command; no ownership
            disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting key, generation, state, expiry or cursor; original receipt is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workflow admission or sandbox quota exhausted; no new effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected safe internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database/schema/capacity unavailable or OUTCOME_UNKNOWN. Retain the original
            journal and idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/fixed-income/v1/sandboxes/{sid}/recovery-keys/rotate:
    post:
      tags:
        - FixedIncomeWorkflow
      operationId: rotateSandboxCapabilities
      summary: rotateSandboxCapabilities
      description:
        Optional local-only feature, default off. Existing login and bearer token required.
        Workflow bindings are separate from ephemeral equity books. Trader and trade binding
        required. Retain old/new capabilities and original request before sending. Rotation
        increments generation and invalidates bindings. After success, recover using the
        retained NEW trade capability before any replay. Receipt lookup precedes
        expected-generation/expiry checks after current authorization. Reusing a key with
        another request returns 409. No query parameters.
      responses:
        '200':
          description: Confirmed response. Monetary trading workflows are outside Phase 2A.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          description: Invalid strict request, date/UUID/key/capability encoding, or query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Existing synthetic session missing or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role, capability scope or current binding does not authorize the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description:
            Disabled workflow, unknown/foreign/purged sandbox or missing command; no ownership
            disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicting key, generation, state, expiry or cursor; original receipt is retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: JSON body exceeds 16384 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Use application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Workflow admission or sandbox quota exhausted; no new effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected safe internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database/schema/capacity unavailable or OUTCOME_UNKNOWN. Retain the original
            journal and idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,128}$
          description:
            Scoped to sandbox across operations; same canonical request replays the original
            response. Never regenerate after an uncertain outcome.
