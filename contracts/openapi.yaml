    PostTradeCommandReceipt:
      type: object
      additionalProperties: false
      required:
        - command
      properties:
        command:
          type: object
          additionalProperties: false
          required:
            - id
            - idempotency_key
            - operation
            - command_seq
            - capability_generation
            - actor_id
            - http_status
            - request_hash
            - request_payload
            - response_body
            - recorded_at
          properties:
            id:
              type: string
              format: uuid
            idempotency_key:
              type: string
              pattern: ^[A-Za-z0-9_-]{8,128}$
            operation:
              type: string
              enum:
                - INITIALIZE
                - REGISTER
                - CORRECT_PRICE
                - BUST
                - SETTLE
                - REVERSE
            command_seq:
              type: string
              pattern: ^(?:[1-9]|[1-8][0-9]|9[0-7])$
            capability_generation:
              type: string
              pattern: ^(?:[1-9][0-9]{0,8}|1000000000)$
            actor_id:
              type: string
              format: uuid
            http_status:
              type: integer
              enum:
                - 200
                - 201
                - 409
            request_hash:
              type: string
              pattern: ^[a-f0-9]{64}$
            request_payload:
              type: object
              description: Immutable submitted financial fields, never capabilities or
                connection material.
            response_body:
              oneOf:
                - $ref: '#/components/schemas/PostTradeInitialization'
                - $ref: '#/components/schemas/PostTradeRegistration'
                - $ref: '#/components/schemas/PostTradeCorrection'
                - $ref: '#/components/schemas/PostTradeBust'
                - $ref: '#/components/schemas/PostTradeSettled'
                - $ref: '#/components/schemas/PostTradeReversed'
                - $ref: '#/components/schemas/PostTradeSettlementFailed'
            recorded_at:
              type: string
              format: date-time
              description: Actual UTC audit time; never a financial trade or simulated
                processing date.
    PostTradeHistory:
      type: object
      additionalProperties: false
      required:
        - source
        - registered
        - original_execution
        - revisions
        - bust
        - settlement_outcomes
      properties:
        source:
          $ref: '#/components/schemas/PostTradeAssessmentSource'
        registered:
          type: boolean
        original_execution:
          type: object
          additionalProperties: false
          required:
            - execution_id
            - source_event_id
            - order_id
            - fill_sequence
            - raw_command_seq
            - instrument_id
            - definition_version
            - side
            - par_amount
            - quoted_settlement_date
            - original_clean_price
            - original_consideration_cents
            - raw_decided_at
            - raw_recorded_at
          properties:
            execution_id:
              type: string
              format: uuid
            source_event_id:
              type: string
              format: uuid
            order_id:
              type: string
              format: uuid
            fill_sequence:
              type: integer
              minimum: 1
              maximum: 8
            raw_command_seq:
              type: string
              pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
            instrument_id:
              type: string
              minLength: 1
              maxLength: 64
            definition_version:
              type: string
              minLength: 1
              maxLength: 128
            side:
              type: string
              enum:
                - BUY
                - SELL
            par_amount:
              type: string
              pattern: ^[0-9]+\.[0-9]{2}$
            quoted_settlement_date:
              type: string
              format: date
            original_clean_price:
              type: string
              pattern: ^(?:0|[1-9][0-9]{0,4})\.[0-9]{12}$
            original_consideration_cents:
              type: string
              pattern: ^(?:0|[1-9][0-9]{0,13})$
            raw_decided_at:
              type: string
              format: date-time
              description: Actual UTC audit time; never a financial trade or simulated
                processing date.
            raw_recorded_at:
              type: string
              format: date-time
              description: Actual UTC audit time; never a financial trade or simulated
                processing date.
        revisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - revision
              - clean_price
              - consideration_cents
              - posttrade_command_seq
              - recorded_at
            properties:
              revision:
                type: integer
                minimum: 0
                maximum: 2
              clean_price:
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,4})\.[0-9]{12}$
              consideration_cents:
                type: string
                pattern: ^(?:0|[1-9][0-9]{0,13})$
              posttrade_command_seq:
                type: string
                pattern: ^(?:[1-9]|[1-8][0-9]|9[0-7])$
              recorded_at:
                type: string
                format: date-time
                description: Actual UTC audit time; never a financial trade or simulated
                  processing date.
          minItems: 0
          maxItems: 3
        bust:
          type: object
          additionalProperties: false
          required:
            - revision
            - posttrade_command_seq
            - recorded_at
          properties:
            revision:
              type: integer
              minimum: 0
              maximum: 2
            posttrade_command_seq:
              type: string
              pattern: ^(?:[1-9]|[1-8][0-9]|9[0-7])$
            recorded_at:
              type: string
              format: date-time
              description: Actual UTC audit time; never a financial trade or simulated
                processing date.
          nullable: true
        settlement_outcomes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - outcome_id
              - revision
              - outcome
              - processing_date
              - reason
              - posting_id
              - posttrade_command_seq
              - recorded_at
            properties:
              outcome_id:
                type: string
                format: uuid
              revision:
                type: integer
                minimum: 0
                maximum: 2
              outcome:
                type: string
                enum:
                  - FAILED
                  - SETTLED
                  - REVERSED
              processing_date:
                type: string
                format: date
              reason:
                type: string
                enum:
                  - INSUFFICIENT_CASH
                  - INSUFFICIENT_SECURITIES
                  - null
                nullable: true
              posting_id:
                type: string
                format: uuid
                nullable: true
              posttrade_command_seq:
                type: string
                pattern: ^(?:[1-9]|[1-8][0-9]|9[0-7])$
              recorded_at:
                type: string
                format: date-time
                description: Actual UTC audit time; never a financial trade or simulated
                  processing date.
          minItems: 0
          maxItems: 8
