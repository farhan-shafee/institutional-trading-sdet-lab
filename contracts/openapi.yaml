components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Random, in-memory synthetic session token. No production identity provider.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: A seeded or session-generated synthetic order ID. The server percent-decodes the
        parameter once; malformed encoding returns 400 (VALIDATION_ERROR).
      schema:
        type: string
        minLength: 1
      example: seed-new-aapl
  responses:
    PublicWorkspaceUnavailable:
      description: Workspace is absent, conflicts with the original key, or persistence,
        maintenance, profile, capacity or commit outcome prevents confirmed completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid fields, filters, or path encoding (VALIDATION_ERROR), or malformed JSON
        (INVALID_JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Viewer role cannot mutate orders (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderNotFound:
      description: Order does not exist in this session's book (ORDER_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderCapacityReached:
      description:
        Hosted-demo session book reached its total order capacity (ORDER_CAPACITY_REACHED).
        The book is unchanged. Cancellation remains available but does not release capacity. No
        Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: JSON body exceeds 16384 bytes (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: JSON endpoint requires Content-Type application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: A hosted-demo request, authentication, or order-mutation admission budget is
        exhausted (RATE_LIMITED). The request does not perform its requested action. Retry after
        the indicated fixed-window reset.
      headers:
        Retry-After:
          description: Positive integer seconds until the exhausted admission window resets.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionCapacityReached:
      description:
        Hosted-demo live-session capacity is full (SESSION_CAPACITY_REACHED). No session or
        book is created. Capacity becomes available when a live session expires or is deleted.
        No Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DiscountCurveNode:
      type: object
      additionalProperties: false
      required:
        - offset_days
        - zero_rate
        - discount_factor
      properties:
        offset_days:
          type: integer
          enum:
            - 365
            - 730
            - 1825
            - 3650
        zero_rate:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{12}$
        discount_factor:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{20}$
    DiscountCurveSnapshot:
      type: object
      additionalProperties: false
      required:
        - version
        - model_version
        - currency
        - fixture_id
        - as_of_date
        - nodes
        - snapshot_id
      properties:
        version:
          type: integer
          enum:
            - 1
        model_version:
          type: string
          enum:
            - DISCOUNT_LOG_LINEAR_ACT365F_V1
        currency:
          type: string
          enum:
            - USD
        fixture_id:
          type: string
          enum:
            - BASE_UP_V1
            - FLAT_V1
            - NEGATIVE_V1
        as_of_date:
          type: string
          format: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        nodes:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/DiscountCurveNode'
        snapshot_id:
          type: string
          pattern: ^[a-f0-9]{64}$
    DiscountCurveCashFlow:
