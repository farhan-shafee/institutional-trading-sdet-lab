      additionalProperties: false
      required:
        - source_model_version
        - source_id
        - sandbox_id
        - generation
        - raw_command_seq
        - last_execution_command_seq
        - posttrade_command_seq
        - last_adjustment_seq
        - initialized
        - raw_execution_count
        - window
        - processing_date_watermark
        - balance_basis
      properties:
        source_model_version:
          type: string
          enum:
            - OWNED_POSTTRADE_SOURCE_V1
        source_id:
          type: string
          pattern: ^[a-f0-9]{64}$
        sandbox_id:
          type: string
          format: uuid
        generation:
          type: string
          pattern: ^(?:[1-9][0-9]{0,8}|1000000000)$
        raw_command_seq:
          type: string
          pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
        last_execution_command_seq:
          type: string
          pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
        posttrade_command_seq:
          type: string
          pattern: ^(?:0|[1-9]|[1-8][0-9]|9[0-7])$
        last_adjustment_seq:
          type: string
          pattern: ^(?:0|[1-9]|[1-8][0-9]|9[0-7])$
        initialized:
          type: boolean
        raw_execution_count:
          type: integer
          minimum: 0
          maximum: 512
        window:
          type: object
          additionalProperties: false
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date
              description: Fixed economic start,2025-01-15 through2031-01-14.
            end:
              type: string
              format: date
              description: Exclusive first contractual coupon after start; applies even to
                closed or busted roots.
          nullable: true
        processing_date_watermark:
          type: string
          format: date
          nullable: true
        balance_basis:
          type: string
          enum:
            - POSTTRADE_SOURCE_SEQUENCE
