        trade_capability:
          type: string
          pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          writeOnly: true
          description:
            Client-generated 32 random bytes, canonical unpadded base64url. Retain privately
            before sending; never place in a URL or diagnostic artifact.
    SandboxRecover:
