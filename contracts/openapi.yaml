components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Random, in-memory synthetic session token. No production identity provider.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: A seeded or session-generated synthetic order ID. The server percent-decodes the
        parameter once; malformed encoding returns 400 (VALIDATION_ERROR).
      schema:
        type: string
        minLength: 1
      example: seed-new-aapl
  responses:
    BadRequest:
      description: Invalid fields, filters, or path encoding (VALIDATION_ERROR), or malformed JSON
        (INVALID_JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, expired, or revoked bearer token (UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Viewer role cannot mutate orders (FORBIDDEN).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderNotFound:
      description: Order does not exist in this session's book (ORDER_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OrderCapacityReached:
      description:
        Hosted-demo session book reached its total order capacity (ORDER_CAPACITY_REACHED).
        The book is unchanged. Cancellation remains available but does not release capacity. No
        Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: JSON body exceeds 16384 bytes (PAYLOAD_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: JSON endpoint requires Content-Type application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: A hosted-demo request, authentication, or order-mutation admission budget is
        exhausted (RATE_LIMITED). The request does not perform its requested action. Retry after
        the indicated fixed-window reset.
      headers:
        Retry-After:
          description: Positive integer seconds until the exhausted admission window resets.
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SessionCapacityReached:
      description:
        Hosted-demo live-session capacity is full (SESSION_CAPACITY_REACHED). No session or
        book is created. Capacity becomes available when a live session expires or is deleted.
        No Retry-After header is sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    FixedIncomeInstrument:
      type: object
      additionalProperties: false
      required:
        - id
        - issuer
        - currency
        - coupon_rate
        - dated_date
        - maturity_date
        - frequency
        - day_count
        - fictional
      properties:
        id:
          type: string
          enum:
            - SYN-UST-2031
            - SYN-CORP-2031
        issuer:
          type: string
          minLength: 1
        currency:
          type: string
          enum:
            - USD
        coupon_rate:
          type: string
          enum:
            - '0.04'
        dated_date:
          type: string
          enum:
            - 2025-01-15
        maturity_date:
          type: string
          enum:
            - 2031-01-15
        frequency:
          type: integer
          enum:
            - 2
        day_count:
          type: string
          enum:
            - ACT_ACT_ICMA
            - THIRTY_360_US
        fictional:
          type: boolean
          enum:
            - true
    FixedIncomeInstruments:
      type: object
      additionalProperties: false
      required:
        - instruments
      properties:
        instruments:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/FixedIncomeInstrument'
    FixedIncomeAnalytics:
      type: object
      additionalProperties: false
      required:
        - instrument
        - settlement_date
        - par_amount
        - yield
        - clean_price
        - dirty_price
        - accrued_interest
        - macaulay_duration
        - modified_duration
        - convexity
        - dv01_usd
        - consideration_usd
        - previous_coupon_date
        - next_coupon_date
        - remaining_coupon_dates
        - conventions
      properties:
        instrument:
          $ref: '#/components/schemas/FixedIncomeInstrument'
        settlement_date:
          type: string
          format: date
        previous_coupon_date:
          type: string
          format: date
        next_coupon_date:
          type: string
          format: date
        remaining_coupon_dates:
          type: array
          minItems: 1
          items:
            type: string
            format: date
        par_amount:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        yield:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{12}$
        clean_price:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        dirty_price:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        accrued_interest:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        macaulay_duration:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        modified_duration:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        convexity:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{10}$
        dv01_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{8}$
        consideration_usd:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        conventions:
          type: object
          additionalProperties: false
          required:
            - precision_digits
            - rounding
            - price_unit
            - rate_unit
            - risk_unit
            - schedule
            - valuation
          properties:
            precision_digits:
              type: integer
              enum:
                - 50
            rounding:
              type: string
              enum:
                - ROUND_HALF_EVEN
            price_unit:
              type: string
              enum:
                - per 100 par
            rate_unit:
              type: string
              enum:
                - annual decimal fraction, semiannual compounding
            risk_unit:
              type: string
              enum:
                - duration years; convexity years squared; DV01 USD for stated long par
            schedule:
              type: string
              enum:
                - regular semiannual, unadjusted, settlement-day coupon excluded
            valuation:
              type: string
              enum:
                - fractional-period compound discounting; no holiday adjustment or ex-dividend
    Symbol:
      type: string
      enum:
