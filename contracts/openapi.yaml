          type: string
          pattern: ^(?:0|[1-9][0-9]{0,4})\.[0-9]{12}$
          nullable: true
        active_consideration_cents:
          type: string
          pattern: ^(?:0|[1-9][0-9]{0,13})$
          nullable: true
        busted:
          type: boolean
        settlement_state:
          type: string
          enum:
            - PENDING
            - FAILED
            - SETTLED
            - REVERSED
            - VOIDED
            - null
          nullable: true
    PostTradeSource:
      type: object
      additionalProperties: false
      required:
        - model_version
        - settlement_model_version
        - sandbox_id
        - generation
        - raw_command_seq
        - last_execution_command_seq
        - posttrade_command_seq
        - last_adjustment_seq
        - initialized
        - window
        - opening_cash_cents
        - available_cash_cents
        - available_securities
        - processing_date_watermark
        - raw_execution_count
        - inventory_truncated
        - roots
        - coverage
      properties:
        model_version:
          type: string
          enum:
            - OWNED_POSTTRADE_SOURCE_V1
        settlement_model_version:
          type: string
          enum:
            - SYNTHETIC_GROSS_AGREED_DATE_WEEKDAYS_V1
        sandbox_id:
          type: string
          format: uuid
        generation:
          type: string
          pattern: ^(?:[1-9][0-9]{0,8}|1000000000)$
        raw_command_seq:
          type: string
          pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
        last_execution_command_seq:
          type: string
          pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
        posttrade_command_seq:
          type: string
          pattern: ^(?:0|[1-9]|[1-8][0-9]|9[0-7])$
        last_adjustment_seq:
          type: string
          pattern: ^(?:0|[1-9]|[1-8][0-9]|9[0-7])$
        initialized:
          type: boolean
        window:
          type: object
          additionalProperties: false
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date
              description: Fixed economic start,2025-01-15 through2031-01-14.
            end:
              type: string
              format: date
              description: Exclusive first contractual coupon after start; applies even to
                closed or busted roots.
          nullable: true
        opening_cash_cents:
          type: string
          enum:
            - '10000000000'
            - null
          nullable: true
        available_cash_cents:
          type: string
          pattern: ^(?:0|[1-9][0-9]{0,13})$
          nullable: true
        available_securities:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - instrument_id
              - available_par
            properties:
              instrument_id:
                type: string
                enum:
                  - SYN-UST-2031
                  - SYN-CORP-2031
              available_par:
                type: string
                pattern: "^[0-9]{1,10}(?:\\.[0-9]{1,2})?$"
          minItems: 2
          maxItems: 2
          nullable: true
        processing_date_watermark:
          type: string
          format: date
          nullable: true
        raw_execution_count:
          type: integer
          minimum: 0
          maximum: 512
        inventory_truncated:
          type: boolean
        roots:
          type: array
          items:
            $ref: '#/components/schemas/PostTradeRoot'
          minItems: 0
          maxItems: 8
        coverage:
          type: object
          additionalProperties: false
          required:
            - complete
            - reasons
          properties:
            complete:
              type: boolean
            reasons:
              type: array
              items:
                type: string
                enum:
                  - POSTTRADE_NOT_INITIALIZED
                  - ROOT_LIMIT_EXCEEDED
                  - UNREGISTERED_EXECUTION
                  - EXECUTION_OUTSIDE_ECONOMIC_WINDOW
                  - SOURCE_CUTOFF_INCOHERENT
              minItems: 0
              maxItems: 5
