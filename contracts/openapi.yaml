        - name: raw_as_of_seq
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:0|[1-9][0-9]?|[1-4][0-9]{2}|50[0-9]|51[0-2])$
          description: Optional raw command cutoff, not above current sequence.
